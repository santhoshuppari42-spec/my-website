let fv='',tv='';

function filt(q){
  if(q.length<2)return[];
  const l=q.toLowerCase();
  const a=AS.filter(s=>s.toLowerCase().startsWith(l));
  const b=AS.filter(s=>!s.toLowerCase().startsWith(l)&&s.toLowerCase().includes(l));
  return [...a,...b].slice(0,10);
}

function showDD(id,items,isFr){

  el.innerHTML=items.map(s=>`<div onmousedown="pick('${id}','${s.replace(/'/g,"\'")}')">${s}</div>`).join('');
  el.style.display='block';
}

function findRoutes(from,to){
  const fIdxs=SI[from]||[];
  const tSet=new Set(SI[to]||[]);

  // DIRECT
  const direct=[];
  for(const ri of fIdxs){
    if(tSet.has(ri)){
      const r=R[ri];
      const fi=r.stops.indexOf(from);
      const ti=r.stops.indexOf(to);
      if(fi!==-1&&ti!==-1){
        const seg=fi<ti?r.stops.slice(fi,ti+1):[...r.stops.slice(ti,fi+1)].reverse();
        direct.push({bus:r.no,seg});
      }
    }
  }
  if(direct.length)return{type:'direct',res:direct.slice(0,6)};

  // ONE CHANGE
  const fmap={};
  for(const ri of fIdxs){
    const r=R[ri];
    const fi=r.stops.indexOf(from);
    if(fi===-1)continue;
    for(let si=0;si<r.stops.length;si++){
      if(si===fi)continue;
      const s=r.stops[si];
      if(!fmap[s])fmap[s]=[];
      fmap[s].push({ri,fi,si});
    }
  }
  const one=[];
  const seen=new Set();
  outer: for(const ri2 of tSet){
    const r2=R[ri2];
    const ti2=r2.stops.indexOf(to);
    if(ti2===-1)continue;
    for(let j=0;j<r2.stops.length;j++){
      if(j===ti2)continue;
      const mid=r2.stops[j];
      if(!fmap[mid])continue;
      for(const {ri,fi,si} of fmap[mid]){
        const k=`${ri}|${mid}|${ri2}`;
        if(seen.has(k))continue;
        seen.add(k);
        const r1=R[ri];
        const seg1=fi<si?r1.stops.slice(fi,si+1):[...r1.stops.slice(si,fi+1)].reverse();
        const seg2=j<ti2?r2.stops.slice(j,ti2+1):[...r2.stops.slice(ti2,j+1)].reverse();
        one.push({bus1:r1.no,seg1,change:mid,bus2:r2.no,seg2});
        if(one.length>=8)break outer;
      }
    }
  }
  if(one.length)return{type:'one',res:one};

  // TWO CHANGES
  const freach=new Set();
  for(const ri of fIdxs)R[ri].stops.forEach(s=>freach.add(s));
  const treach=new Set();
  for(const ri2 of tSet)R[ri2].stops.forEach(s=>treach.add(s));
  const mids=[...freach].filter(s=>treach.has(s)&&s!==from&&s!==to);
  const two=[];
  const seen2=new Set();
  for(const mid of mids){
    if(two.length>=5)break;
    const mset=new Set(SI[mid]||[]);
    const r1s=fIdxs.filter(i=>mset.has(i));
    const r2s=[...tSet].filter(i=>mset.has(i));
    if(!r1s.length||!r2s.length)continue;
    const r1=R[r1s[0]],r2=R[r2s[0]];
    const k=`${r1.no}|${mid}|${r2.no}`;
    if(seen2.has(k))continue;
    seen2.add(k);
    two.push({bus1:r1.no,bus2:r2.no,mid});
  }
  if(two.length)return{type:'two',res:two};
  return{type:'none'};
}

const COLS=['#f97316','#38bdf8','#a78bfa','#4ade80','#fb7185','#fbbf24'];
function col(no){return COLS[no.charCodeAt(0)%COLS.length];}

function chain(stops,fr,to,max){
  max=max||14;
  let s=stops;
  if(s.length>max){s=[...stops.slice(0,6),'...',...stops.slice(-6)];}
  return '<div class="chain">'+s.map((x,i)=>{
    if(x==='...')return '<span class="arr">&bull;&bull;&bull;</span>';
    const cls=x===fr?'stop fr':x===to?'stop to':'stop';
    return `<span class="${cls}">${x}</span>`+(i<s.length-1?'<span class="arr">&#8250;</span>':'');
  }).join('')+'</div>';
}

function mini(label,stops,c,max){
  max=max||8;
  let s=stops;
  if(s.length>max)s=[...stops.slice(0,4),'...',...stops.slice(-3)];
  return `<div class="mrow"><span class="mlabel">${label}:</span><div class="mstops">${s.map((x,i)=>
    x==='...'?'<span class="arr">&bull;</span>':
    `<span class="stop" style="background:${c}18;border-color:${c}44;color:${c}">${x}</span>`+
    (i<s.length-1?'<span class="arr" style="font-size:9px">&#8250;</span>':'')
  ).join('')}</div></div>`;
}

function search(){
  if(!fv||!tv)return;
  document.getElementById('results').innerHTML='<div class="card" style="text-align:center;color:#8b949e;padding:20px">🔍 Searching...</div>';
  setTimeout(()=>{
    const r=findRoutes(fv,tv);
    let html='';
    if(r.type==='direct'){
      html=`<div class="sec-title" style="color:#4ade80">✅ Direct Buses — ${r.res.length} found</div>`;
      for(const x of r.res){
        const c=col(x.bus);
        html+=`<div class="card">
          <span class="badge" style="background:${c}22;border:1px solid ${c}55;color:${c}">🚌 ${x.bus}</span>
          <span style="font-size:11px;color:#484f58;margin-left:8px">${x.seg.length-1} stops · No change needed</span>
          ${chain(x.seg,fv,tv)}
        </div>`;
      }
    } else if(r.type==='one'){
      html=`<div class="sec-title" style="color:#fbbf24">🔄 One Change — ${r.res.length} options</div>`;
      for(const x of r.res){
        const c1=col(x.bus1),c2=col(x.bus2);
        html+=`<div class="card">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px">
            <span class="badge" style="background:${c1}22;border:1px solid ${c1}55;color:${c1}">🚌 ${x.bus1}</span>
            <span style="color:#484f58;font-size:11px">→ change at</span>
            <span class="chbadge">📍 ${x.change}</span>
            <span style="color:#484f58;font-size:11px">→ take</span>
            <span class="badge" style="background:${c2}22;border:1px solid ${c2}55;color:${c2}">🚌 ${x.bus2}</span>
          </div>
          ${mini('Bus '+x.bus1,x.seg1,c1)}
          ${mini('Bus '+x.bus2,x.seg2,c2)}
        </div>`;
      }
    } else if(r.type==='two'){
      html=`<div class="sec-title" style="color:#f87171">🔁 Two Changes — ${r.res.length} options</div>`;
      for(const x of r.res){
        const c1=col(x.bus1),c2=col(x.bus2);
        html+=`<div class="card">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            <span class="badge" style="background:${c1}22;border:1px solid ${c1}55;color:${c1}">🚌 ${x.bus1}</span>
            <span style="color:#484f58;font-size:11px">→</span>
            <span class="chbadge">📍 ${x.mid}</span>
            <span style="color:#484f58;font-size:11px">→</span>
            <span class="badge" style="background:${c2}22;border:1px solid ${c2}55;color:${c2}">🚌 ${x.bus2}</span>
          </div>
          <div style="font-size:11px;color:#484f58;margin-top:8px">Change bus at ${x.mid}</div>
        </div>`;
      }
    } else {
      html=`<div class="card nores">
        <div style="font-size:36px;margin-bottom:10px">😕</div>
        No TSRTC route found between<br>
        <strong style="color:#e6edf3">${fv}</strong> and <strong style="color:#e6edf3">${tv}</strong><br>
        <div style="font-size:12px;margin-top:8px;color:#484f58">Try nearby stops or major hubs</div>
      </div>`;
    }
    document.getElementById('results').innerHTML=html;
  },30);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&fv&&tv)search();});
</script>
</body>
</html>
