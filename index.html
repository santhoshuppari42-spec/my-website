        function capitalizeWords(str) {
            if (!str) return '';
            return str.split(' ').map(word => {
                if (word.length === 0) return '';
                // Handle mixed case, but keep acronyms (like MGBS, ECIL) in their original case if they are fully uppercase
                if (word.toUpperCase() === word && word.length > 1) {
                    return word;
                }
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }).join(' ');
        }
        
        // Helper function to get bus routes from the data, checking both directions
        function getRoutes(from, to) {
            const key1 = `${from}-${to}`;
            const key2 = `${to}-${from}`;
            
            let routes = [];
            
            if (busRoutes[key1]) {
                routes.push({
                    start: from,
                    end: to,
                    buses: busRoutes[key1].split(',').map(b => b.trim())
                });
            }
            if (busRoutes[key2]) {
                routes.push({
                    start: to, // The route is defined from 'to' to 'from'
                    end: from,
                    buses: busRoutes[key2].split(',').map(b => b.trim())
                });
            }
            
            // Filter unique bus numbers, in case they are listed in both directions (e.g., "Koti-Secunderabad": "8" and "Secunderabad-Koti": "8")
            const uniqueRoutes = {};
            routes.forEach(route => {
                route.buses.forEach(bus => {
                    uniqueRoutes[bus] = route;
                });
            });
            
            return Object.keys(uniqueRoutes).map(bus => ({
                busNo: bus,
                start: from,
                end: to,
                direction: uniqueRoutes[bus].start === from ? 'direct' : 'reverse'
            }));
        }


        let allLocationsArray = [];
        const fromInput = document.getElementById("fromInput");
        const toInput = document.getElementById("toInput");
        const fromSelectedValue = document.getElementById("fromSelectedValue");
        const toSelectedValue = document.getElementById("toSelectedValue");


        // Autocomplete function (kept largely the same as it's functional)
        function autocomplete(inp, hiddenInput, arr) {
            let currentFocus;
            inp.addEventListener("input", function(e) {
                let a, b, i, val = this.value;
                closeAllLists();
                if (!val) {
                    hiddenInput.value = "";
                    return false;
                }
                currentFocus = -1;
                a = document.createElement("DIV");
                a.setAttribute("id", this.id + "autocomplete-list");
                a.setAttribute("class", "autocomplete-items");
                this.parentNode.appendChild(a);
                for (i = 0; i < arr.length; i++) {
                    // Check if the location includes the search term (case-insensitive)
                    if (arr[i].toUpperCase().includes(val.toUpperCase())) {
                        b = document.createElement("DIV");
                        // Highlight the matching letters
                        let highlighted = arr[i].replace(new RegExp(val, "gi"), (match) => `<strong>${match}</strong>`);
                        b.innerHTML = highlighted;
                        b.innerHTML += "<input type='hidden' value='" + arr[i] + "'>";
                        b.addEventListener("click", function(e) {
                            inp.value = this.getElementsByTagName("input")[0].value;
                            hiddenInput.value = inp.value;
                            closeAllLists();
                        });
                        a.appendChild(b);
                    }
                }
            });

            inp.addEventListener("keydown", function(e) {
                let x = document.getElementById(this.id + "autocomplete-list");
                if (x) x = x.getElementsByTagName("div");
                if (e.keyCode == 40) { // DOWN
                    currentFocus++;
                    addActive(x);
                } else if (e.keyCode == 38) { // UP
                    currentFocus--;
                    addActive(x);
                } else if (e.keyCode == 13) { // ENTER
                    e.preventDefault();
                    if (currentFocus > -1) {
                        if (x) x[currentFocus].click();
                    } else {
                        // User pressed Enter without selecting a suggested item
                        // We assume the user wants the capitalized version if it matches
                        let capitalized = capitalizeWords(inp.value);
                        if (arr.includes(capitalized)) {
                            inp.value = capitalized;
                            hiddenInput.value = capitalized;
                        } else {
                             hiddenInput.value = inp.value; // Store as is for validation in findBus
                        }
                        closeAllLists();
                    }
                }
            });

            function addActive(x) {
                if (!x) return false;
                removeActive(x);
                if (currentFocus >= x.length) currentFocus = 0;
                if (currentFocus < 0) currentFocus = (x.length - 1);
                x[currentFocus].classList.add("autocomplete-active");
                // Optional: Scroll to active element
                x[currentFocus].scrollIntoView({ block: "nearest", inline: "nearest" });
            }

            function removeActive(x) {
                for (let i = 0; i < x.length; i++) {
                    x[i].classList.remove("autocomplete-active");
                }
            }

            function closeAllLists(elmnt) {
                let x = document.getElementsByClassName("autocomplete-items");
                for (let i = 0; i < x.length; i++) {
                    if (elmnt != x[i] && elmnt != inp) {
                        x[i].parentNode.removeChild(x[i]);
                    }
                }
            }

            document.addEventListener("click", function(e) {
                closeAllLists(e.target);
                // Final check to sync hidden value if a valid location is typed/left in the box
                if (e.target !== inp) {
                    let capitalized = capitalizeWords(inp.value);
                    if (allLocationsArray.includes(capitalized)) {
                        hiddenInput.value = capitalized;
                    } else if (inp.value) {
                         // If the user hasn't selected a location, clear the hidden value on blur
                         hiddenInput.value = "";
                    }
                }
            });
        }


        function findBus() {
            const fromRaw = fromSelectedValue.value;
            const toRaw = toSelectedValue.value;
            const resultDiv = document.getElementById("result");

            resultDiv.innerHTML = ""; // Clear previous result

            if (!fromRaw || !toRaw) {
                resultDiv.innerHTML = "<strong>Error:</strong> Please select both a starting point and a destination.";
                return;
            }

            const from = capitalizeWords(fromRaw);
            const to = capitalizeWords(toRaw);

            // Double-check validation against the master list
            if (!allLocationsArray.includes(from) || !allLocationsArray.includes(to)) {
                resultDiv.innerHTML = "<strong>Error:</strong> Please select valid locations from the suggestions for both starting and destination points.";
                return;
            }
            
            if (from === to) {
                resultDiv.innerHTML = `<strong>You are already there!</strong> The starting point and destination are the same.`;
                return;
            }

            let allSuggestions = [];

            // --- 1. Check for Direct Route ---
            const directRoutes = getRoutes(from, to);
            
            if (directRoutes.length > 0) {
                // If the route value is not a bus number but a special instruction (e.g., "Walkable or Auto"), handle it.
                if (directRoutes[0].busNo.includes("Walkable") || directRoutes[0].busNo.includes("Auto")) {
                     allSuggestions.push(`**Recommendation:** ${directRoutes[0].busNo}. The distance is likely very short.`);
                } else if (directRoutes[0].busNo.includes("(")) {
                    // Handle complex pre-written messages like "10H (to Hitech City, then 10H to Secunderabad)"
                    allSuggestions.push(`**Complex Direct Route:** ${directRoutes[0].busNo}`);
                }
                else {
                    const busList = directRoutes.map(r => r.busNo).join(', ');
                    allSuggestions.push(`**Direct Bus Route:** Take Bus **${busList}**.`);
                }
            }


            // --- 2. Check for One-Transfer Route (Two-Leg Journey) ---
            let transferSuggestions = new Set();
            
            for (let midPoint of allLocationsArray) {
                if (midPoint === from || midPoint === to) continue;

                const leg1Routes = getRoutes(from, midPoint);
                const leg2Routes = getRoutes(midPoint, to);

                if (leg1Routes.length > 0 && leg2Routes.length > 0) {
                    
                    leg1Routes.forEach(route1 => {
                        leg2Routes.forEach(route2 => {
                            // Filter out "Walkable or Auto" for the transfer legs to prioritize bus routes, 
                            // but allow it if it's the *only* option.
                            if (route1.busNo.includes("Walkable") && leg1Routes.length > 1) return;
                            if (route2.busNo.includes("Walkable") && leg2Routes.length > 1) return;
                            
                            const bus1 = route1.busNo;
                            const bus2 = route2.busNo;

                            transferSuggestions.add(`Transfer at **${midPoint}**: Take Bus **${bus1}** from **${from}** to **${midPoint}**, then take Bus **${bus2}** from **${midPoint}** to **${to}**.`);
                        });
                    });
                }
            }

            allSuggestions = allSuggestions.concat([...transferSuggestions]);


            // --- 3. Display Results ---
            if (allSuggestions.length > 0) {
                resultDiv.innerHTML = `<strong>Route Suggestions from ${from} to ${to}:</strong>`;
                const ul = document.createElement('ul');
                
                // Add direct routes first
                allSuggestions.filter(s => s.includes("Direct Bus Route") || s.includes("Recommendation")).forEach(s => {
                    const li = document.createElement('li');
                    li.innerHTML = s;
                    ul.appendChild(li);
                });

                // Add transfer routes next (limit to 5 to avoid overwhelming the user)
                let transferCount = 0;
                [...transferSuggestions].filter(s => s.includes("Transfer")).slice(0, 5).forEach(s => {
                    const li = document.createElement('li');
                    li.innerHTML = s;
                    ul.appendChild(li);
                    transferCount++;
                });

                if (transferCount > 0 && !ul.children.length) {
                    resultDiv.innerHTML = `<strong>Route Suggestions from ${from} to ${to}:</strong>`;
                }

                if (ul.children.length > 0) {
                    resultDiv.appendChild(ul);
                } else if (directRoutes.length > 0) {
                     resultDiv.innerHTML = `<strong>Route Suggestions from ${from} to ${to}:</strong><ul><li>${allSuggestions[0]}</li></ul>`;
                } else {
                     resultDiv.textContent = `Sorry, no bus information available for this route, even with a one-stop transfer.`;
                }

            } else {
                resultDiv.textContent = `Sorry, no direct or one-transfer bus information is available for ${from} to ${to}.`;
            }
        }


        // Populate allLocationsArray on page load and initialize autocomplete
        document.addEventListener("DOMContentLoaded", function() {
            const locations = new Set();
            Object.keys(busRoutes).forEach(route => {
                const [from, to] = route.split("-");
                locations.add(from);
                locations.add(to);
            });
            // Handle locations embedded in complex route descriptions
            Object.values(busRoutes).forEach(route => {
                 if (route.includes('(') && route.includes('then')) {
                    const parts = route.match(/\(([^)]+)\)/g);
                    if (parts) {
                        parts.forEach(p => {
                            const transferPointMatch = p.match(/to\s([^,)]+)/i);
                            if (transferPointMatch) {
                                locations.add(capitalizeWords(transferPointMatch[1].trim()));
                            }
                        });
                    }
                 }
            });
            
            allLocationsArray = [...locations].sort();

            // Initialize autocomplete for both input fields
            autocomplete(fromInput, fromSelectedValue, allLocationsArray);
            autocomplete(toInput, toSelectedValue, allLocationsArray);
        });
    </script>

</body>
</html>
