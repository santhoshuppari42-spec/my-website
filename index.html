<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invest for Farmers</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at 20% 30%, #00ff88, #0078ff, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
    }

    .container {
      position: relative;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      padding: 50px 40px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.3);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00ffcc, #00aaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glowText 3s infinite;
    }

    @keyframes glowText {
      0%, 100% { text-shadow: 0 0 10px #00ffcc; }
      50% { text-shadow: 0 0 25px #00aaff; }
    }

    p {
      font-size: 1rem;
      color: #e0e0e0;
      margin-bottom: 20px;
    }

    a {
      text-decoration: none;
      color: #fff;
      background: linear-gradient(90deg, #00ff88, #00aaff);
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
      transition: all 0.3s ease;
      display: inline-block;
    }

    a:hover {
      transform: scale(1.1) rotate(2deg);
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
    }

    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: move 8s linear infinite;
    }

    .circle1 { width: 300px; height: 300px; background: #00ffcc; top: -100px; left: -100px; }
    .circle2 { width: 250px; height: 250px; background: #0078ff; bottom: -80px; right: -80px; }

    @keyframes move {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, 30px); }
    }
  </style>
</head>
<body>
  <div class="circle1 glow-circle"></div>
  <div class="circle2 glow-circle"></div>

  <div class="container">
    <h1>Invest for Farmers 🌾</h1>
    <p>Support Indian farmers and be part of the future of agriculture.  
       If you want to invest, message me on Instagram 👇</p>
    <a href="https://www.instagram.com/u.ss999" target="_blank">
      💬 Message @u.ss999
    </a>
  </div>
</body>
</html>
